<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Driver Portal</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.148.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "driverportal": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
    <link
 rel="stylesheet"
 href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script
 src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>

<mvc:View
    controllerName="controller/Map.controller.js"
    xmlns:mvc="sap.ui.core.mvc"
    xmlns="sap.m"
    xmlns:core="sap.ui.core">

    <Page title="Vehicle Tracking">

        <content>

            <core:HTML
                content='&lt;div id="map" style="width:100%; height:500px"&gt;&lt;/div&gt;' />

        </content>

    </Page>
    <link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>

</mvc:View>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="driverportal"
        data-id="container"
        data-settings='{"id" : "driverportal"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
